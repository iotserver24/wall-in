[package]
name = "wall-in-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
fs2 = "0.4"
wall-in-rainmeter = { path = "../rainmeter" }

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
